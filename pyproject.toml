[project]
name = "upworthy-lora"
version = "0.1.0"
description = "LoRA SFT of Qwen3-14B on Upworthy headline A/B tests, and why it did not work"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yubo Cao", email = "yubo@yubo-cao.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["upworthy_lora"]

[tool.ruff]
line-length = 96
